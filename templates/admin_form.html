{{define "admin_form.html"}}
{{template "header" .}}
<section class="masthead">
  <p class="eyebrow">Admin</p>
  <h1 class="headline headline-compact">{{if .IsEdit}}Edit post{{else}}New post{{end}}</h1>
  <a href="/admin" class="text-button">&larr; Back to all posts</a>
</section>

{{if .Error}}<p class="flash flash-error">{{.Error}}</p>{{end}}

<form method="post" action="{{if .IsEdit}}/admin/posts/{{.Post.Slug}}/edit{{else}}/admin/posts/new{{end}}" class="plain-form">
  <label>Title<input type="text" name="title" value="{{.Post.Title}}" required autofocus></label>
  <label>Tags (comma-separated)<input type="text" name="tags" value="{{.Post.TagsJoined}}"></label>
  <label>Date<input type="date" name="post_date" value="{{.Post.PostDateValue}}"></label>
  <label>Body — Markdown. Footnotes like <code>[^1]</code> become sidenotes; tables and <code>~~strikethrough~~</code> work too.
    <textarea name="body" rows="22" required>{{.Post.Body}}</textarea>
  </label>
  <label class="checkbox-label">
    <input type="checkbox" name="published" {{if .Post.Published}}checked{{end}}>
    Published (unchecked = draft, hidden from visitors)
  </label>
  <button type="submit" class="text-submit">{{if .IsEdit}}Save changes{{else}}Create post{{end}}</button>
</form>
{{template "footer" .}}
{{end}}
