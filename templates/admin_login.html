{{define "admin_login.html"}}
{{template "header" .}}
<section class="masthead">
  <p class="eyebrow">Admin</p>
  <h1 class="headline headline-compact">Log in</h1>
</section>
{{if .Error}}<p class="flash flash-error">{{.Error}}</p>{{end}}
<form method="post" action="/admin/login" class="plain-form">
  <label>Username<input type="text" name="username" autocomplete="username" required autofocus></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit" class="text-submit">Log in</button>
</form>
{{template "footer" .}}
{{end}}
