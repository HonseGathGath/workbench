{{define "header"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .PageTitle}}{{.PageTitle}} · {{end}}Workbench</title>
<link rel="alternate" type="application/rss+xml" title="Workbench" href="{{.Root}}feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{.Root}}style.css">
<script>
(function () {
  var saved = localStorage.getItem("theme");
  var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
</head>
<body>
<header class="site-header">
  <div class="header-row">
    <div>
      <a class="site-title" href="{{.Root}}">Workbench</a>
      <p class="byline">Ghaith Lassoued</p>
    </div>
    <button id="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">◐</button>
  </div>
  <p class="site-desc">notes on an FPGA SmartNIC security/performance project.</p>
</header>
<main>
{{end}}
{{define "footer"}}</main>
<footer class="site-footer">
  <p>Workbench &middot; <a href="{{.Root}}feed.xml">RSS</a></p>
</footer>
<script src="{{.Root}}theme.js" defer></script>
<script src="{{.Root}}search.js" defer></script>
</body>
</html>
{{end}}
