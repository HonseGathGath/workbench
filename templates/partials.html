{{define "header"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .PageTitle}}{{.PageTitle}} · {{end}}Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script>
(function () {
  var saved = localStorage.getItem("theme");
  var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
</head>
<body>
<header class="site-header">
  <div class="header-row">
    <div>
      <a class="site-title" href="/">Workbench</a>
      <p class="byline">Ghaith Lassoued</p>
    </div>
    <button id="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">◐</button>
  </div>
  <p class="site-desc">notes on an FPGA SmartNIC security/performance project.</p>
</header>
<main>
{{end}}
{{define "footer"}}</main>
<footer class="site-footer">
  <p>Workbench &middot; a running log, not a publication.</p>
</footer>
<script src="/static/theme.js" defer></script>
</body>
</html>
{{end}}
